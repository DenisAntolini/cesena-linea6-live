<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E30613"/>
      <stop offset="100%" stop-color="#99000B"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Sfondo arrotondato per icona app / mobile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Bordo sottile di contrasto interno -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6"/>

  <!-- Sagoma icona autobus stilizzato in filigrana -->
  <g opacity="0.12" fill="#FFFFFF">
    <path d="M120 180 h272 c20 0 36 16 36 36 v140 c0 16 -12 28 -28 28 v24 c0 10 -8 18 -18 18 h-20 c-10 0 -18 -8 -18 -18 v-24 h-176 v24 c0 10 -8 18 -18 18 h-20 c-10 0 -18 -8 -18 -18 v-24 c-16 0 -28 -12 -28 -28 v-140 c0 -20 16 -36 36 -36 z"/>
  </g>

  <!-- Cerchio centrale bianco con ombra -->
  <circle cx="256" cy="236" r="148" fill="#FFFFFF" filter="url(#dropShadow)"/>
  <circle cx="256" cy="236" r="136" fill="none" stroke="#E30613" stroke-width="8"/>

  <!-- Grande numero "6" della Linea Start Romagna -->
  <text x="256" y="315" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="220" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#E30613" 
        letter-spacing="-6">6</text>

  <!-- Badge testo "CESENA LIVE" in basso -->
  <rect x="116" y="416" width="280" height="52" rx="26" fill="#0F172A" filter="url(#dropShadow)"/>
  <text x="256" y="450" 
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="22" 
        font-weight="800" 
        text-anchor="middle" 
        fill="#38BDF8" 
        letter-spacing="3">CESENA LIVE</text>
</svg>
